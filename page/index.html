<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>GitLab プレビュー</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_/preview.css">
<script id="gp-config" type="application/json">{{CONFIG}}</script>
<script src="_/preview.js" defer></script>
</head>
<body>
<header id="gp-header">
  <span id="gp-file"></span>
  <div id="gp-controls">
    <a id="gp-back" href="./" hidden>編集中の文書へ</a>
    <a id="gp-list" href="?list">一覧</a>
    <button id="gp-outline-toggle" type="button" aria-controls="gp-outline" aria-expanded="false" disabled>見出し</button>
    <button id="gp-sticky-toggle" type="button" aria-pressed="false">表を固定</button>
    <button id="gp-notices-toggle" type="button" aria-controls="gp-notices" aria-expanded="false" hidden>GitLab との違い 0</button>
    <label>配色 <select id="gp-theme" aria-label="プレビューの配色">
      <option value="system">システム</option>
      <option value="light">ライト</option>
      <option value="dark">ダーク</option>
    </select></label>
    <label>本文幅 <select id="gp-width" aria-label="プレビューの本文幅">
      <option value="fluid">全幅</option>
      <option value="fixed">固定幅</option>
    </select></label>
  </div>
</header>
<section id="gp-notices" aria-label="GitLab との違い" hidden><div id="gp-notices-content"></div></section>
<div id="gp-banner" role="status" hidden></div>
<aside id="gp-outline" aria-label="見出し" hidden><nav><ul id="gp-outline-list"></ul></nav></aside>
<div id="gp-layout">
<div id="gp-page" class="file-holder">
  <main id="gp-content" class="file-content js-markup-content md">読み込み中…</main>
</div>
</div>
</body>
</html>
