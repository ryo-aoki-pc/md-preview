<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>GitLab プレビュー</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_/preview.css">
<script id="gp-config" type="application/json">{{CONFIG}}</script>
<script src="_/preview.js" defer></script>
<script src="_/copy-code.js" defer></script>
<script src="_/edit-grid.js" defer></script>
<script src="_/edit-targets.js" defer></script>
<script src="_/edit.js" defer></script>
<script src="_/review.js" defer></script>
</head>
<body>
<header id="gp-header">
  <span id="gp-file"></span>
  <div id="gp-controls">
    <a id="gp-back" href="./" hidden>編集中の文書へ</a>
    <a id="gp-list" href="?list">一覧</a>
    <button id="gp-outline-toggle" type="button" aria-controls="gp-outline" aria-expanded="false" disabled>見出し</button>
    <button id="gp-sticky-toggle" type="button" aria-pressed="false">表を固定</button>
    <button id="gp-edit-toggle" type="button" aria-pressed="false" hidden>編集</button>
    <button id="gp-edit-add" type="button" aria-haspopup="menu" aria-controls="gp-edit-menu-document" aria-expanded="false" hidden>追加</button>
    <button id="gp-review-toggle" type="button" aria-pressed="false" hidden>コメント</button>
    <button id="gp-notices-toggle" type="button" aria-controls="gp-notices" aria-expanded="false" hidden>GitLab との違い 0</button>
    <label>配色 <select id="gp-theme" aria-label="プレビューの配色">
      <option value="system">システム</option>
      <option value="light">ライト</option>
      <option value="dark">ダーク</option>
    </select></label>
    <label>本文幅 <select id="gp-width" aria-label="プレビューの本文幅">
      <option value="fluid">全幅</option>
      <option value="fixed">固定幅</option>
    </select></label>
  </div>
</header>
<section id="gp-notices" aria-label="GitLab との違い" hidden><div id="gp-notices-content"></div></section>
<div id="gp-banner" role="status" hidden></div>
<aside id="gp-outline" aria-label="見出し" hidden><nav><ul id="gp-outline-list"></ul></nav></aside>
<div id="gp-outline-resizer" role="separator" aria-orientation="vertical" aria-controls="gp-outline" aria-label="見出し欄の幅" tabindex="0" hidden></div>
<div id="gp-layout">
<div id="gp-page" class="file-holder">
  <main id="gp-content" class="file-content js-markup-content md">読み込み中…</main>
</div>
</div>
<template id="gp-edit-table-template">
  <form id="gp-edit-table-picker" role="dialog" aria-label="入れる表の大きさ" hidden>
    <label>列 <input id="gp-edit-table-cols" type="number" min="1" max="20" step="1" value="2" required></label>
    <label>本文の行 <input id="gp-edit-table-rows" type="number" min="1" max="100" step="1" value="2" required></label>
    <button type="submit">入れる</button>
    <button id="gp-edit-table-cancel" type="button">閉じる</button>
  </form>
</template>
</body>
</html>
