name: 配布

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    name: 検証と配布
    runs-on: ubuntu-latest
    steps:
      - name: ソースを取得
        uses: actions/checkout@v7
      - name: Go を用意
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Node.js を用意
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: タグと既定の版を照合
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'タグは v と数字3つの版で指定してください。' >&2
            exit 1
          fi
          release_version="${RELEASE_TAG#v}"
          default_version=$(sed -n 's/^var Version = "\([^"]*\)"$/\1/p' internal/version/version.go)
          if [ "$release_version" != "$default_version" ]; then
            echo 'タグと internal/version の既定の版が一致しません。' >&2
            exit 1
          fi
          printf 'RELEASE_VERSION=%s\n' "$release_version" >> "$GITHUB_ENV"
      - name: 整形を確認
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo 'gofmt で整形されていないファイル:'
            echo "$unformatted"
            exit 1
          fi
      - name: 静的検査
        run: go vet ./...
      - name: 試験
        run: go test ./...
      - name: 競合の検査
        run: go test -race -timeout 20m ./...
      - name: 表の範囲と写しを検証
        run: node --test test/edit-grid.test.mjs
      - name: sticky の格子と組み立てを検証
        run: node --test sticky/test/grid.test.mjs sticky/test/build.test.mjs
      - name: ブックマークレットの生成物を確認
        run: node sticky/tools/build-bookmarklet.mjs --check
      - name: 配布物をビルド
        run: bash scripts/build-release.sh "$RELEASE_VERSION" dist
      - name: sha256 を確認
        run: ( cd dist && sha256sum -c SHA256SUMS )
      - name: 配布の説明を用意
        run: |
          cat > dist/release-notes.md <<'NOTES'
          mdpreview と mdtable を、単体の実行ファイルで配布します。

          | ファイル | 道具 | OS | CPU |
          | --- | --- | --- | --- |
          | mdpreview-windows-amd64.exe | mdpreview | Windows | amd64 (x86-64) |
          | mdpreview-linux-amd64 | mdpreview | Linux | amd64 (x86-64) |
          | mdpreview-linux-arm64 | mdpreview | Linux | arm64 (AArch64) |
          | mdtable-windows-amd64.exe | mdtable | Windows | amd64 (x86-64) |

          導入と更新の手順は [mdpreview](https://github.com/ryo-aoki-pc/md-tools/blob/main/docs/install.md) と [mdtable](https://github.com/ryo-aoki-pc/md-tools/blob/main/mdtable/docs/install.md) を参照してください。

          同梱ライセンスは、mdpreview-THIRD-PARTY-LICENSES.txt または `mdpreview --licenses`、mdtable-THIRD-PARTY-LICENSES.txt または `mdtable --licenses` でそれぞれ確認できます。
          Linux / Git Bash では、実行ファイル4つ・ライセンス2つと SHA256SUMS を同じフォルダーへ保存し、`sha256sum -c SHA256SUMS` で確認してください。
          1つだけ取得した場合は、SHA256SUMS の名前が一致する1行を取り出し、`sha256sum -c` に渡してください。
          PowerShell では `Get-FileHash .\mdpreview-windows-amd64.exe -Algorithm SHA256` または `Get-FileHash .\mdtable-windows-amd64.exe -Algorithm SHA256` の値を SHA256SUMS の同名の行と照合してください。
          NOTES
      - name: GitHub Releases に配布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file dist/release-notes.md \
            dist/mdpreview-windows-amd64.exe dist/mdpreview-linux-amd64 dist/mdpreview-linux-arm64 \
            dist/mdtable-windows-amd64.exe dist/mdpreview-THIRD-PARTY-LICENSES.txt \
            dist/mdtable-THIRD-PARTY-LICENSES.txt dist/SHA256SUMS
