name: Go 版の配布

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    name: 検証と配布
    runs-on: ubuntu-latest
    steps:
      - name: ソースを取得
        uses: actions/checkout@v7
      - name: Go を用意
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: タグと既定の版を照合
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'タグは v と数字3つの版で指定してください。' >&2
            exit 1
          fi
          release_version="${RELEASE_TAG#v}"
          default_version=$(sed -n 's/^var Version = "\([^"]*\)"$/\1/p' internal/version/version.go)
          if [ "$release_version" != "$default_version" ]; then
            echo 'タグと internal/version の既定の版が一致しません。' >&2
            exit 1
          fi
          printf 'RELEASE_VERSION=%s\n' "$release_version" >> "$GITHUB_ENV"
      - name: 整形を確認
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo 'gofmt で整形されていないファイル:'
            echo "$unformatted"
            exit 1
          fi
      - name: 静的検査
        run: go vet ./...
      - name: 試験
        run: go test ./...
      - name: 3つの対象向けにビルド
        run: bash scripts/build-release.sh "$RELEASE_VERSION" dist
      - name: 成果物の版とライセンスを確認
        run: |
          actual_version=$(dist/mdpreview-linux-amd64 --version)
          if [ "$actual_version" != "$RELEASE_VERSION" ]; then
            echo '成果物の版が一致しません。' >&2
            exit 1
          fi
          dist/mdpreview-linux-amd64 --licenses > dist/THIRD-PARTY-LICENSES.txt
      - name: sha256 と配布の説明を用意
        run: |
          cd dist
          sha256sum mdpreview-windows-amd64.exe mdpreview-linux-amd64 mdpreview-linux-arm64 THIRD-PARTY-LICENSES.txt > SHA256SUMS
          cat > release-notes.md <<'NOTES'
          Go 版の mdpreview を単体の実行ファイルで配布します。

          | ファイル | OS | CPU |
          | --- | --- | --- |
          | mdpreview-windows-amd64.exe | Windows | amd64 (x86-64) |
          | mdpreview-linux-amd64 | Linux | amd64 (x86-64) |
          | mdpreview-linux-arm64 | Linux | arm64 (AArch64) |

          同梱ライセンスは THIRD-PARTY-LICENSES.txt または `mdpreview --licenses` で確認できます。
          Linux / Git Bash では、成果物4つと SHA256SUMS を同じフォルダーへ保存し、`sha256sum -c SHA256SUMS` で確認してください。
          PowerShell では `Get-FileHash .\mdpreview-windows-amd64.exe -Algorithm SHA256` の値を SHA256SUMS の同名の行と照合してください。
          NOTES
      - name: GitHub Releases に配布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file dist/release-notes.md \
            dist/mdpreview-windows-amd64.exe dist/mdpreview-linux-amd64 dist/mdpreview-linux-arm64 \
            dist/THIRD-PARTY-LICENSES.txt dist/SHA256SUMS
