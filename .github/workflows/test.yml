name: 検証

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: 検証（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: ソースを取得
        uses: actions/checkout@v7
      - name: Go を用意
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Node.js を用意
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: 表の範囲と写しを検証
        run: node --test test/edit-grid.test.mjs
      - name: 整形を確認
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt で整形されていないファイル:"
            echo "$unformatted"
            exit 1
          fi
      - name: 静的検査
        shell: bash
        run: |
          packages=$(go list ./... | grep -v '^github.com/ryo-aoki-pc/md-tools/mdtable\(/\|$\)')
          go vet $packages
      - name: 試験
        shell: bash
        run: |
          packages=$(go list ./... | grep -v '^github.com/ryo-aoki-pc/md-tools/mdtable\(/\|$\)')
          go test $packages
      - name: 競合の検査
        if: runner.os == 'Linux'
        shell: bash
        run: |
          packages=$(go list ./... | grep -v '^github.com/ryo-aoki-pc/md-tools/mdtable\(/\|$\)')
          go test -race $packages
      - name: 配布物をビルド
        shell: bash
        run: |
          bash scripts/build-release.sh '0.0.0-ci' .tests/dist
          ( cd .tests/dist && sha256sum -c SHA256SUMS )

  sticky:
    name: sticky の検証
    runs-on: ubuntu-latest
    steps:
      - name: ソースを取得
        uses: actions/checkout@v7
      - name: Node.js を用意
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: 格子と組み立てを検証
        run: node --test sticky/test/grid.test.mjs sticky/test/build.test.mjs
      - name: ブックマークレットの生成物を確認
        run: node sticky/tools/build-bookmarklet.mjs --check
