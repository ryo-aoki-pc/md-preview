name: 検証

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: 検証（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: ソースを取得
        uses: actions/checkout@v7
      - name: Go を用意
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Node.js を用意
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: 表の範囲と写しを検証
        run: node --test test/edit-grid.test.mjs
      - name: 整形を確認
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt で整形されていないファイル:"
            echo "$unformatted"
            exit 1
          fi
      - name: 静的検査
        run: go vet ./...
      - name: 試験
        run: go test ./...
      - name: 競合の検査
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: 3つの対象向けにビルド
        if: runner.os == 'Linux'
        run: bash scripts/build-release.sh '0.0.0-ci' .tests/dist
